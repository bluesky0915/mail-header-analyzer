<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>사칭메일 분석서비스</title>
  <style>
    /* ===== CSS 변수 ===== */
    :root {
      --bg:        #0d1117;
      --bg2:       #161b22;
      --bg3:       #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --text2:     #8b949e;
      --text3:     #6e7681;
      --green:     #3fb950;
      --green-bg:  #0d2818;
      --yellow:    #d29922;
      --yellow-bg: #2d2100;
      --orange:    #e3632a;
      --orange-bg: #2d1500;
      --red:       #f85149;
      --red-bg:    #2d0000;
      --blue:      #58a6ff;
      --blue-bg:   #0d1f3c;
      --purple:    #bc8cff;
      --radius:    8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===== 공통 헤더 ===== */
    .site-header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .site-header .logo { font-size: 24px; }
    .header-title-wrap h1 { font-size: 18px; font-weight: 700; }
    .header-title-wrap .sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    /* 리얼시큐 로고 */
    .realsecu-logo {
      height: 36px;
      width: auto;
      display: block;
      object-fit: contain;
      /* 흰 배경 로고에 다크모드 대응: 로고 자체가 흰 글씨+컬러이므로 그대로 표시 */
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    /* 헤더 로고 */
    .realsecu-logo {
      height: 32px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* ===== 스텝 진행 표시 (제거됨) ===== */

    /* ===== 페이지 공통 ===== */
    .page { display: none; }
    .page.active { display: block; }
    .main { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

    /* ===== 버튼 ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; border-radius: var(--radius);
      padding: 11px 28px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
      text-decoration: none;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #79b8ff; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost {
      background: var(--bg3); color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: #fff; }

    /* ===== 분석 페이지 ===== */

    /* 업로드 패널 */
    .upload-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 22px;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .tab-btn {
      background: none; border: none; color: var(--text2);
      padding: 8px 22px; cursor: pointer; font-size: 13px; font-weight: 500;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: all 0.18s;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-btn:hover:not(.active) { color: var(--text); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 44px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragging {
      border-color: var(--blue);
      background: rgba(88,166,255,0.04);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .dz-icon { font-size: 40px; margin-bottom: 10px; }
    .drop-zone .dz-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .drop-zone .dz-hint  { font-size: 12px; color: var(--text3); }
    .drop-zone .dz-file-info {
      display: none;
      margin-top: 14px;
      background: var(--bg3);
      border: 1px solid var(--green);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
    }

    textarea.header-input {
      width: 100%;
      min-height: 210px;
      background: var(--bg3);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea.header-input:focus { border-color: var(--blue); }

    .btn-row {
      display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap;
    }
    .sample-link { color: var(--blue); font-size: 12px; cursor: pointer; text-decoration: underline; }

    /* ===== 로딩 ===== */
    .loading-overlay {
      display: none;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 52px 24px;
      text-align: center;
      margin-bottom: 22px;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .loading-steps { display: flex; flex-direction: column; gap: 6px; }
    .loading-step { font-size: 13px; color: var(--text3); padding: 3px 0; transition: color 0.3s; }
    .loading-step.active { color: var(--blue); font-weight: 600; }
    .loading-step.done   { color: var(--green); }

    /* ===== 결과 ===== */
    #results { display: none; }

    .verdict-banner {
      border-radius: var(--radius); padding: 22px 26px;
      margin-bottom: 22px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    }
    .verdict-banner.SAFE       { background: var(--green-bg);  border: 1px solid var(--green); }
    .verdict-banner.WARNING    { background: var(--yellow-bg); border: 1px solid var(--yellow); }
    .verdict-banner.SUSPICIOUS { background: var(--orange-bg); border: 1px solid var(--orange); }
    .verdict-banner.DANGEROUS  { background: var(--red-bg);    border: 1px solid var(--red); }
    .verdict-icon { font-size: 52px; flex-shrink: 0; }
    .verdict-info { flex: 1; min-width: 200px; }
    .verdict-label { font-size: 26px; font-weight: 800; margin-bottom: 5px; }
    .verdict-banner.SAFE .verdict-label       { color: var(--green); }
    .verdict-banner.WARNING .verdict-label    { color: var(--yellow); }
    .verdict-banner.SUSPICIOUS .verdict-label { color: var(--orange); }
    .verdict-banner.DANGEROUS .verdict-label  { color: var(--red); }
    .verdict-desc { color: var(--text2); font-size: 13px; }
    .score-box { text-align: center; flex-shrink: 0; }
    .score-number { font-size: 44px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .verdict-banner.SAFE .score-number       { color: var(--green); }
    .verdict-banner.WARNING .score-number    { color: var(--yellow); }
    .verdict-banner.SUSPICIOUS .score-number { color: var(--orange); }
    .verdict-banner.DANGEROUS .score-number  { color: var(--red); }
    .score-label { font-size: 11px; color: var(--text2); }
    .score-bar-wrap { background: var(--bg3); border-radius: 4px; height: 8px; margin-top: 8px; width: 110px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

    .summary-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; margin-bottom: 22px; }
    .summary-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .summary-card .label { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
    .summary-card .value { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }

    .badge { display: inline-block; border-radius: 12px; padding: 2px 10px; font-size: 11px; font-weight: 600; }
    .badge-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green); }
    .badge-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-orange { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange); }
    .badge-gray   { background: var(--bg3);       color: var(--text2);  border: 1px solid var(--border); }
    .badge-blue   { background: var(--blue-bg);   color: var(--blue);   border: 1px solid var(--blue); }

    .section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .section-header {
      background: var(--bg3); border-bottom: 1px solid var(--border);
      padding: 12px 18px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
    }
    .section-header h3 { font-size: 14px; font-weight: 600; flex: 1; }
    .section-header .chevron { transition: transform 0.2s; color: var(--text3); }
    .section-header.collapsed .chevron { transform: rotate(-90deg); }
    .section-body { padding: 16px 18px; }
    .section-body.collapsed { display: none; }

    .auth-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media(max-width:680px) { .auth-grid { grid-template-columns: 1fr; } }
    .auth-card { border-radius: var(--radius); padding: 14px; border: 1px solid; }
    .auth-card.pass    { background: var(--green-bg);  border-color: var(--green); }
    .auth-card.fail    { background: var(--red-bg);    border-color: var(--red); }
    .auth-card.warning { background: var(--yellow-bg); border-color: var(--yellow); }
    .auth-card.none    { background: var(--bg3);       border-color: var(--border); }
    .auth-card .auth-type   { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 5px; }
    .auth-card .auth-status { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    .auth-card.pass .auth-status    { color: var(--green); }
    .auth-card.fail .auth-status    { color: var(--red); }
    .auth-card.warning .auth-status { color: var(--yellow); }
    .auth-card.none .auth-status    { color: var(--text2); }
    .auth-card .auth-detail { font-size: 11px; color: var(--text2); }

    .domain-table { width: 100%; border-collapse: collapse; }
    .domain-table th { text-align: left; font-size: 10px; color: var(--text3); padding: 6px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    .domain-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: top; }
    .domain-table tr:last-child td { border-bottom: none; }
    .domain-table tr:hover td { background: var(--bg3); }
    .domain-name { font-weight: 600; color: var(--blue); font-family: monospace; }
    .record-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .record-tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; font-family: monospace; color: var(--text2); }

    .ip-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
    .ip-card:last-child { margin-bottom: 0; }
    .ip-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .ip-addr { font-family: monospace; font-size: 15px; font-weight: 700; color: var(--blue); }
    .ip-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 6px; }
    .ip-detail-item { font-size: 11px; color: var(--text2); }
    .ip-detail-item strong { color: var(--text); }

    .hop-item { display: flex; gap: 12px; margin-bottom: 12px; }
    .hop-line { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
    .hop-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); flex-shrink: 0; margin-top: 4px; }
    .hop-dot.first { background: var(--green); }
    .hop-dot.last  { background: var(--text3); }
    .hop-connector { width: 2px; background: var(--border); flex: 1; margin-top: 2px; }
    .hop-content { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
    .hop-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; }
    .hop-from  { font-size: 13px; font-weight: 600; font-family: monospace; }
    .hop-meta  { font-size: 11px; color: var(--text2); margin-top: 4px; }
    .hop-ips   { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .hop-ip-tag { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-size: 10px; font-family: monospace; color: var(--text2); }

    .factors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width:640px) { .factors-grid { grid-template-columns: 1fr; } }
    .factor-list { list-style: none; }
    .factor-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .factor-item:last-child { border-bottom: none; }
    .factor-delta { font-size: 11px; font-weight: 700; flex-shrink: 0; min-width: 36px; text-align: right; }
    .factor-delta.neg { color: var(--red); }
    .factor-delta.pos { color: var(--green); }

    .raw-header {
      background: var(--bg3); border-radius: var(--radius); padding: 14px;
      font-family: monospace; font-size: 11px; line-height: 1.9;
      color: var(--text2); white-space: pre-wrap; word-break: break-all;
      max-height: 420px; overflow-y: auto;
    }

    .issue-box { border-radius: var(--radius); padding: 9px 13px; margin-bottom: 7px; font-size: 12px; display: flex; gap: 8px; }
    .issue-box.critical { background: var(--red-bg);    border: 1px solid var(--red);    color: var(--red); }
    .issue-box.high     { background: var(--red-bg);    border: 1px solid var(--red);    color: var(--red); }
    .issue-box.medium   { background: var(--yellow-bg); border: 1px solid var(--yellow); color: var(--yellow); }
    .issue-box.low      { background: var(--blue-bg);   border: 1px solid var(--blue);   color: var(--blue); }
    .issue-box.info     { background: var(--bg3);       border: 1px solid var(--border); color: var(--text2); }

    .spf-mech { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .spf-tag { border-radius: 4px; padding: 2px 8px; font-size: 11px; font-family: monospace; }
    .spf-tag.ip4     { background: #0d2818; color: var(--green);  border: 1px solid var(--green); }
    .spf-tag.ip6     { background: #0d2818; color: var(--green);  border: 1px solid var(--green); }
    .spf-tag.include { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue); }
    .spf-tag.mx      { background: var(--bg3); color: var(--purple); border: 1px solid var(--purple); }
    .spf-tag.a       { background: var(--bg3); color: var(--purple); border: 1px solid var(--purple); }
    .spf-tag.all     { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
    .spf-tag.redirect { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }

    .error-box { background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--radius); padding: 16px 20px; color: var(--red); margin-bottom: 16px; }

    /* ===== 모달 (개인정보 상세) ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1000;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 560px;
      max-height: 80vh;
      display: flex; flex-direction: column;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .modal-header {
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .modal-close:hover { background: var(--bg3); color: var(--text); }
    .modal-body { padding: 20px 22px; overflow-y: auto; font-size: 12px; color: var(--text2); line-height: 1.8; }
    .modal-body h4 { color: var(--text); font-size: 13px; margin: 14px 0 6px; }
    .modal-body h4:first-child { margin-top: 0; }
    .modal-body table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    .modal-body th, .modal-body td { border: 1px solid var(--border); padding: 7px 10px; font-size: 11px; }
    .modal-body th { background: var(--bg3); color: var(--text); font-weight: 600; }
    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }

    /* ===== 유틸 ===== */
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .mono { font-family: monospace; }
    .empty-msg { color: var(--text3); font-size: 12px; font-style: italic; padding: 10px 0; }
  </style>
</head>
<body>

<!-- ===== 공통 헤더 ===== -->
<header class="site-header">
  <span class="logo">🔍</span>
  <div class="header-title-wrap">
    <h1>사칭메일 분석서비스</h1>
    <div class="sub">이메일 헤더 · EML 파일 발신 검증 시스템</div>
  </div>
  <div class="header-right">
    <img src="/realsecu-logo-transparent.png" alt="RealSecu Security System" class="realsecu-logo" />
  </div>
</header>

<!-- ===================================================== -->
<!-- ===== [PAGE] 분석 페이지 ===== -->
<!-- ===================================================== -->
<div class="page active" id="page2">
  <div class="main" style="max-width:1280px;">

    <!-- 업로드 패널 -->
    <div class="upload-panel">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('file')">📎 EML 파일 업로드</button>
        <button class="tab-btn" onclick="switchTab('text')">📋 헤더 텍스트 입력</button>
      </div>

      <!-- 파일 탭 -->
      <div id="tab-file" class="tab-content active">
        <div class="drop-zone" id="dropZone"
             ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
          <input type="file" id="fileInput" accept=".eml,.txt,.msg" onchange="onFileChange(event)"/>
          <div class="dz-icon">📧</div>
          <div class="dz-title">EML 파일을 여기에 드래그하거나 클릭하여 선택</div>
          <div class="dz-hint">.eml · .txt · .msg 지원 | 최대 10MB</div>
          <div class="dz-file-info" id="dzFileInfo"></div>
        </div>
      </div>

      <!-- 텍스트 탭 -->
      <div id="tab-text" class="tab-content">
        <textarea class="header-input" id="headerText"
          placeholder="이메일 헤더를 여기에 붙여넣으세요&#10;&#10;예) From, To, Subject, Received, Authentication-Results, DKIM-Signature 등의 헤더 전체"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
          🔍 발신정보 분석 시작
        </button>
        <button class="btn btn-ghost" onclick="resetAnalysis()">초기화</button>
        <span class="sample-link" onclick="loadSample()">샘플 데이터 불러오기</span>
      </div>
    </div>

    <!-- 로딩 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-title">발신정보 분석 중...</div>
      <div class="loading-steps">
        <div class="loading-step" id="step1">📨 이메일 헤더 파싱</div>
        <div class="loading-step" id="step2">🌐 DNS 서버(8.8.8.8) 조회</div>
        <div class="loading-step" id="step3">🔎 SPF / DKIM / DMARC 검증</div>
        <div class="loading-step" id="step4">📊 종합 분석 및 판정</div>

// =============================================================
// 모달
// =============================================================
function openModal(type) {
  currentModalType = type;
  const c = MODAL_CONTENTS[type];
  document.getElementById('modalTitle').textContent  = c.title;
  document.getElementById('modalBody').innerHTML     = c.body;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  currentModalType = null;
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
function agreeFromModal() {
  if (currentModalType) setChecked(currentModalType, true);
  updateAgreeAllBtn();
  closeModal();
}

// =============================================================
// [2단계] 파일 업로드 / 분석
// =============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i===0&&tab==='file')||(i===1&&tab==='text'));
  });
  document.getElementById('tab-file').classList.toggle('active', tab==='file');
  document.getElementById('tab-text').classList.toggle('active', tab==='text');
}

function onDragOver(e)  { e.preventDefault(); document.getElementById('dropZone').classList.add('dragging'); }
function onDragLeave(e) { document.getElementById('dropZone').classList.remove('dragging'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('dragging');
  if (e.dataTransfer.files.length > 0) setFile(e.dataTransfer.files[0]);
}
function onFileChange(e) { if (e.target.files.length > 0) setFile(e.target.files[0]); }
function setFile(file) {
  selectedFile = file;
  const el = document.getElementById('dzFileInfo');
  el.textContent = `✅ 선택됨: ${file.name}  (${(file.size/1024).toFixed(1)} KB)`;
  el.style.display = 'block';
}

async function loadSample() {
  try {
    const res  = await fetch('/api/sample');
    const data = await res.json();
    switchTab('text');
    document.getElementById('headerText').value = data.sample;
  } catch(e) { alert('샘플 로드 실패: ' + e.message); }
}

function resetAnalysis() {
  selectedFile = null;
  document.getElementById('fileInput').value  = '';
  document.getElementById('headerText').value = '';
  document.getElementById('dzFileInfo').style.display = 'none';
  document.getElementById('results').style.display    = 'none';
  document.getElementById('results').innerHTML        = '';
  document.getElementById('loadingOverlay').style.display = 'none';
}

async function analyze() {
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loadingOverlay').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';

  const steps = ['step1','step2','step3','step4'];
  steps.forEach(s => { document.getElementById(s).className = 'loading-step'; });
  let idx = 0;
  const timer = setInterval(() => {
    if (idx > 0) document.getElementById(steps[idx-1]).className = 'loading-step done';
    if (idx < steps.length) {
      document.getElementById(steps[idx]).className = 'loading-step active';
      idx++;
    }
  }, 800);

  try {
    let response;
    if (currentTab === 'file' && selectedFile) {
      const fd = new FormData();
      fd.append('file', selectedFile);
      if (currentUser) fd.append('user_info', JSON.stringify(currentUser));
      response = await fetch('/api/analyze', { method: 'POST', body: fd });
    } else if (currentTab === 'text') {
      const text = document.getElementById('headerText').value.trim();
      if (!text) { alert('헤더 텍스트를 입력해 주세요.'); return; }
      const fd = new FormData();
      fd.append('text', text);
      if (currentUser) fd.append('user_info', JSON.stringify(currentUser));
      response = await fetch('/api/analyze', { method: 'POST', body: fd });
    } else {
      alert('파일을 선택하거나 헤더를 입력해 주세요.');
      return;
    }

    clearInterval(timer);
    steps.forEach(s => { document.getElementById(s).className = 'loading-step done'; });

    const data = await response.json();
    if (!response.ok || data.error) { showError(data.error || '분석 실패'); return; }
    renderResults(data);

  } catch(e) {
    clearInterval(timer);
    showError('서버 연결 오류: ' + e.message);
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('loadingOverlay').style.display = 'none';
  }
}

// =============================================================
// 오류 표시
// =============================================================
function showError(msg) {
  const r = document.getElementById('results');
  r.style.display = 'block';
  r.innerHTML = `<div class="error-box">⚠️ ${escHtml(msg)}</div>`;
}

// =============================================================
// 결과 렌더링
// =============================================================
function renderResults(data) {
  const analysis = data.analysis;
  const emailData = data.email_data;
  const dnsResults = data.dns_results;
  const summary  = analysis.summary;
  const verdict  = analysis.verdict;

  const scoreColor = verdict.verdict === 'SAFE'    ? 'var(--green)'
    : verdict.verdict === 'WARNING'    ? 'var(--yellow)'
    : verdict.verdict === 'SUSPICIOUS' ? 'var(--orange)'
    : 'var(--red)';

  let html = '';

  // ── 판정 배너 ──
  html += `<div class="verdict-banner ${verdict.verdict}">
    <div class="verdict-icon">${verdict.icon}</div>
    <div class="verdict-info">
      <div class="verdict-label">${verdict.label} — ${verdict.verdict}</div>
      <div class="verdict-desc">${verdict.description}</div>
      <div style="margin-top:8px;font-size:12px;color:var(--text2)">
        분석 소요: ${data.elapsed_seconds}초 &nbsp;|&nbsp;
        도메인 ${summary.total_domains_analyzed}개 &nbsp;|&nbsp;
        IP ${summary.total_ips_analyzed}개 &nbsp;|&nbsp;
        경유 서버 ${summary.hop_count}개
        ${currentUser ? ` &nbsp;|&nbsp; 분석자: <strong>${escHtml(currentUser.name)}</strong> (${escHtml(currentUser.company)})` : ''}
      </div>
    </div>
    <div class="score-box">
      <div class="score-number">${summary.score}</div>
      <div class="score-label">신뢰도 점수 / 100</div>
      <div class="score-bar-wrap">
        <div class="score-bar" style="width:${summary.score}%;background:${scoreColor}"></div>
      </div>
    </div>
  </div>`;

  // ── 요약 카드 ──
  html += `<div class="summary-cards">`;
  html += sCard('발신자 (From)', escHtml(summary.from || '-'));
  html += sCard('발신 도메인',   `<span class="mono" style="color:var(--blue)">${escHtml(summary.from_domain || '-')}</span>`);
  html += sCard('제목',          escHtml(summary.subject || '-'));
  html += sCard('날짜',          escHtml(summary.date || '-'));
  html += sCard('SPF',   spfBadge(analysis.authentication.spf.status));
  html += sCard('DKIM',  dkimBadge(analysis.authentication.dkim.status));
  html += sCard('DMARC', dmarcBadge(analysis.authentication.dmarc.status));
  html += sCard('경유 서버',     `<span style="font-size:18px;font-weight:700">${summary.hop_count}</span>`);
  html += `</div>`;

  // ── 섹션들 ──
  html += section('🔐 이메일 인증 결과 (SPF / DKIM / DMARC)', renderAuthSection(analysis.authentication), false);
  html += section('⚖️ 분석 요인 및 점수 배분', renderFactorsSection(analysis), false);
  html += section('🌐 도메인별 DNS 조회 결과', renderDomainSection(analysis.domain_analysis), false);
  html += section('🖥️ 발신 IP 분석', renderIPSection(analysis.ip_analysis), false);
  html += section('📬 발신 경로 (Received 헤더)', renderRoutingSection(emailData, analysis.routing), false);
  html += section('🔗 도메인 일관성 검사', renderConsistencySection(analysis.consistency), false);
  html += section('📄 원본 이메일 헤더', renderRawHeader(emailData), true);

  const r = document.getElementById('results');
  r.style.display = 'block';
  r.innerHTML = html;
}

function sCard(label, value) {
  return `<div class="summary-card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

// ── 배지 ──
function spfBadge(s) {
  const m = { pass:['badge-green','✅ PASS'], fail:['badge-red','❌ FAIL'], softfail:['badge-yellow','⚠️ SOFTFAIL'],
    neutral:['badge-gray','❓ NEUTRAL'], none:['badge-gray','— 없음'], dns_only:['badge-blue','📋 DNS만'], error:['badge-orange','⚠️ ERROR'] };
  const [c,t] = m[s]||['badge-gray',`— ${s}`];
  return `<span class="badge ${c}">${t}</span>`;
}
function dkimBadge(s) {
  const m = { pass:['badge-green','✅ PASS'], fail:['badge-red','❌ FAIL'], none:['badge-gray','— 없음'],
    dns_key_exists:['badge-blue','📋 키확인'], no_dns_key:['badge-orange','⚠️ 키없음'], error:['badge-orange','⚠️ ERROR'] };
  const [c,t] = m[s]||['badge-gray',`— ${s}`];
  return `<span class="badge ${c}">${t}</span>`;
}
function dmarcBadge(s) {
  const m = { pass:['badge-green','✅ PASS'], fail:['badge-red','❌ FAIL'], none:['badge-gray','— 없음'], dns_only:['badge-blue','📋 DNS만'] };
  const [c,t] = m[s]||['badge-gray',`— ${s}`];
  return `<span class="badge ${c}">${t}</span>`;
}

// ── 인증 섹션 ──
function renderAuthSection(auth) {
  const spf=auth.spf, dkim=auth.dkim, dmarc=auth.dmarc;
  function ac(s){ return ['pass','dns_key_exists','dns_only'].includes(s)?'pass':s==='fail'?'fail':['softfail','no_dns_key','error'].includes(s)?'warning':'none'; }
  let html=`<div class="auth-grid">`;

  html+=`<div class="auth-card ${ac(spf.status)}">
    <div class="auth-type">SPF (Sender Policy Framework)</div>
    <div class="auth-status">${spfBadge(spf.status)}</div>
    <div class="auth-detail">${escHtml(spf.detail)}</div>`;
  if(spf.dns_record&&spf.dns_record.parsed){
    const sp=spf.dns_record.parsed;
    html+=`<hr class="divider"><div style="font-size:11px;color:var(--text3)">SPF 레코드:</div><div class="spf-mech">`;
    for(const m of(sp.mechanisms||[])){ html+=`<span class="spf-tag ${m.type}">${escHtml(m.type)}${m.value?':'+escHtml(m.value):''}</span>`; }
    html+=`</div><div style="font-size:10px;color:var(--text3);margin-top:5px">정책: ${sp.all_policy||'없음'}</div>`;
  }
  html+=`</div>`;

  html+=`<div class="auth-card ${ac(dkim.status)}">
    <div class="auth-type">DKIM (DomainKeys Identified Mail)</div>
    <div class="auth-status">${dkimBadge(dkim.status)}</div>
    <div class="auth-detail">${escHtml(dkim.detail)}</div>`;
  for(const sig of(dkim.dns_records||[])){
    html+=`<hr class="divider"><div style="font-size:11px"><span class="mono" style="color:var(--blue)">${escHtml(sig.domain||'')}</span>
    <span style="color:var(--text3)"> / selector: </span><span class="mono">${escHtml(sig.selector||'')}</span></div>
    <div style="font-size:10px;color:var(--text3);margin-top:3px">DNS 공개키: ${sig.has_dns_key?'<span style="color:var(--green)">✅ 확인됨</span>':'<span style="color:var(--red)">❌ 없음</span>'}</div>`;
  }
  html+=`</div>`;

  html+=`<div class="auth-card ${ac(dmarc.status)}">
    <div class="auth-type">DMARC</div>
    <div class="auth-status">${dmarcBadge(dmarc.status)}</div>
    <div class="auth-detail">${escHtml(dmarc.detail)}</div>`;
  if(dmarc.dns_record&&dmarc.dns_record.parsed){
    const dp=dmarc.dns_record.parsed;
    html+=`<hr class="divider"><div style="font-size:11px;color:var(--text3)">DMARC 정책:</div>
    <div style="margin-top:4px"><span class="badge ${dp.policy==='reject'?'badge-red':dp.policy==='quarantine'?'badge-yellow':'badge-gray'}">p=${escHtml(dp.policy||'none')}</span>
    ${dp.pct!==undefined?`<span class="badge badge-gray" style="margin-left:4px">pct=${dp.pct}%</span>`:''}
    </div>`;
  }
  html+=`</div></div>`;
  return html;
}

// ── 요인 섹션 ──
function renderFactorsSection(analysis) {
  const s=analysis.score_breakdown, risks=analysis.risk_factors, trusts=analysis.trust_factors;
  const KL = {
    spf_pass:'SPF 인증 통과', spf_fail:'SPF 인증 실패', spf_softfail:'SPF 소프트 실패', spf_none:'SPF 레코드 없음',
    dkim_pass:'DKIM 서명 검증 통과', dkim_fail:'DKIM 검증 실패', dkim_none:'DKIM 서명 없음',
    dmarc_pass:'DMARC 정책 통과', dmarc_fail:'DMARC 실패', dmarc_none:'DMARC 없음',
    from_domain_exists:'발신 도메인 DNS 확인됨', from_domain_no_mx:'MX 레코드 없음',
    from_domain_no_dns:'발신 도메인 DNS 없음', ptr_exists:'PTR 레코드 확인',
    ptr_no_exists:'PTR 레코드 없음', ptr_fcrdns:'FCrDNS 검증 통과',
    reply_to_mismatch:'Reply-To 도메인 불일치', return_path_mismatch:'Return-Path 불일치',
    msgid_domain_mismatch:'Message-ID 도메인 불일치', private_ip_sending:'사설 IP 발송',
    no_received_headers:'Received 헤더 없음'
  };
  let html=`<div class="factors-grid">`;
  html+=`<div><div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px">🚨 위험 요인 (${risks.length}개)</div><ul class="factor-list">`;
  if(!risks.length) html+=`<li class="empty-msg">위험 요인 없음</li>`;
  else risks.forEach(r=>{ html+=`<li class="factor-item"><span class="factor-delta neg">${r.delta}</span><span>${KL[r.key]||escHtml(r.key)}</span></li>`; });
  html+=`</ul></div>`;
  html+=`<div><div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">✅ 신뢰 요인 (${trusts.length}개)</div><ul class="factor-list">`;
  if(!trusts.length) html+=`<li class="empty-msg">신뢰 요인 없음</li>`;
  else trusts.forEach(t=>{ html+=`<li class="factor-item"><span class="factor-delta pos">+${t.delta}</span><span>${KL[t.key]||escHtml(t.key)}</span></li>`; });
  html+=`</ul></div></div>`;
  html+=`<div style="margin-top:12px;padding:11px 14px;background:var(--bg3);border-radius:var(--radius);font-size:12px">
    기준점: <strong>50</strong>
    ${s.bonuses.length?` &nbsp;+&nbsp; <span style="color:var(--green)">가점 +${s.bonuses.reduce((a,b)=>a+b.delta,0)}</span>`:''}
    ${s.deductions.length?` &nbsp;+&nbsp; <span style="color:var(--red)">감점 ${s.deductions.reduce((a,b)=>a+b.delta,0)}</span>`:''}
    &nbsp;= <strong>최종 ${s.final}점</strong>
  </div>`;
  return html;
}

// ── 도메인 섹션 ──
function renderDomainSection(domainAnalysis) {
  const domains = Object.values(domainAnalysis);
  if(!domains.length) return `<div class="empty-msg">분석된 도메인 없음</div>`;
  let html=`<table class="domain-table"><thead><tr><th>도메인</th><th>역할</th><th>A</th><th>MX</th><th>SPF</th><th>DMARC</th><th>상태</th><th>이슈</th></tr></thead><tbody>`;
  for(const da of domains){
    const ms = !da.dns_exists?'critical':da.issues.some(i=>i.severity==='high')?'high':da.issues.some(i=>i.severity==='medium')?'medium':'ok';
    const sb = ms==='ok'?`<span class="badge badge-green">정상</span>`:ms==='critical'||ms==='high'?`<span class="badge badge-red">불량</span>`:`<span class="badge badge-yellow">주의</span>`;
    const aRec = da.a_records.slice(0,2).join(', ');
    const mxRec = da.mx_records.slice(0,2).map(m=>typeof m==='object'?m.exchange:m).join(', ');
    html+=`<tr>
      <td><div class="domain-name">${escHtml(da.domain)}</div>${da.a_records.length?`<div class="record-list">${da.a_records.slice(0,3).map(ip=>`<span class="record-tag">${escHtml(ip)}</span>`).join('')}</div>`:''}</td>
      <td>${da.role.map(r=>`<div style="font-size:11px;color:var(--text2)">${escHtml(r)}</div>`).join('')}</td>
      <td>${da.has_a?`<span style="color:var(--green)">✅</span><div style="font-size:10px;color:var(--text3)">${escHtml(aRec)}</div>`:`<span style="color:var(--text3)">—</span>`}</td>
      <td>${da.has_mx?`<span style="color:var(--green)">✅</span><div style="font-size:10px;color:var(--text3)">${escHtml(mxRec)}</div>`:`<span style="color:var(--text3)">—</span>`}</td>
      <td>${da.has_spf?`<span style="color:var(--green)">✅</span><div style="font-size:10px;color:var(--text3)">${escHtml((da.spf_record?.parsed?.all_policy)||'')}</div>`:`<span style="color:var(--red)">❌</span>`}</td>
      <td>${da.has_dmarc?`<span style="color:var(--green)">✅</span>`:`<span style="color:var(--text3)">—</span>`}</td>
      <td>${sb}</td>
      <td>${da.issues.map(i=>`<div class="issue-box ${i.severity}" style="margin-bottom:4px">${escHtml(i.message)}</div>`).join('')||'<span class="empty-msg">없음</span>'}</td>
    </tr>`;
  }
  html+=`</tbody></table>`;
  return html;
}

// ── IP 섹션 ──
function renderIPSection(ipAnalysis) {
  const ips=Object.values(ipAnalysis);
  if(!ips.length) return `<div class="empty-msg">분석된 IP 없음</div>`;
  let html='';
  for(const ip of ips){
    const tl = ip.is_private?`<span class="badge badge-orange">사설 IP</span>`:`<span class="badge badge-blue">공인 IP</span>`;
    const ptr = ip.has_ptr?`<span style="color:var(--green)">✅ ${escHtml(ip.ptr_hostname||'')}</span>`:ip.is_private?`<span style="color:var(--text3)">— (사설 IP)</span>`:`<span style="color:var(--red)">❌ PTR 없음</span>`;
    const fcr = ip.ptr_fcrdns?`<span style="color:var(--green)">✅ 일치</span>`:ip.has_ptr?`<span style="color:var(--yellow)">⚠️ 불일치</span>`:'—';
    const spf = ip.is_in_spf?`<span style="color:var(--green)">✅ 포함됨</span>`:`<span style="color:var(--text3)">— 미확인</span>`;
    html+=`<div class="ip-card">
      <div class="ip-header">
        <span class="ip-addr">${escHtml(ip.ip)}</span>${tl}
        ${(ip.role||[]).map(r=>`<span class="badge badge-gray">${escHtml(r)}</span>`).join('')}
      </div>
      <div class="ip-details">
        <div class="ip-detail-item"><strong>PTR:</strong> ${ptr}</div>
        <div class="ip-detail-item"><strong>FCrDNS:</strong> ${fcr}</div>
        <div class="ip-detail-item"><strong>SPF 포함:</strong> ${spf}</div>
      </div>
      ${ip.notes?.length?`<div style="margin-top:7px">${ip.notes.map(n=>`<div class="issue-box info">${escHtml(n)}</div>`).join('')}</div>`:''}
      ${ip.issues?.length?`<div style="margin-top:4px">${ip.issues.map(i=>`<div class="issue-box ${i.severity}">${escHtml(i.message)}</div>`).join('')}</div>`:''}
    </div>`;
  }
  return html;
}

// ── 발신 경로 ──
function renderRoutingSection(emailData, routing) {
  const hops=routing.hops||[];
  if(!hops.length) return `<div class="empty-msg">Received 헤더 없음 — 발신 경로 추적 불가</div>`;
  let html=`<div style="font-size:12px;color:var(--text2);margin-bottom:12px">총 ${hops.length}개 서버 경유 (아래→위: 발신→수신)</div>`;
  const rev=[...hops].reverse();
  for(let i=0;i<rev.length;i++){
    const hop=rev[i], isF=(i===0), isL=(i===rev.length-1);
    const dc=isF?'hop-dot first':isL?'hop-dot last':'hop-dot';
    const lb=isF?'🟢 최초 발신 서버':isL?'🔵 최종 수신 서버':`📡 경유 서버 #${i}`;
    html+=`<div class="hop-item">
      <div class="hop-line"><div class="${dc}"></div>${!isL?'<div class="hop-connector"></div>':''}</div>
      <div class="hop-content">
        <div class="hop-label">${lb}</div>
        <div class="hop-from">${escHtml(hop.from_host||'알 수 없음')}</div>
        <div class="hop-meta">${hop.by_host?`→ <strong>by</strong> ${escHtml(hop.by_host)}`:''}${hop.timestamp?` &nbsp;|&nbsp; 🕐 ${escHtml(hop.timestamp)}`:''}</div>
        ${hop.ips?.length?`<div class="hop-ips">${hop.ips.map(ip=>`<span class="hop-ip-tag">${escHtml(ip)}</span>`).join('')}</div>`:''}
      </div>
    </div>`;
  }
  return html;
}

// ── 일관성 ──
function renderConsistencySection(c) {
  function irow(label,value,hi){ return `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px"><div style="font-size:10px;color:var(--text3)">${label}</div><div style="font-size:13px;font-family:monospace;color:${hi||'var(--text)'};margin-top:2px">${escHtml(value||'—')}</div></div>`; }
  let html=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:12px">`;
  html+=irow('From 도메인',c.from_domain,'var(--blue)');
  html+=irow('Reply-To 도메인',c.reply_to_domain,(c.reply_to_domain&&c.reply_to_domain!==c.from_domain)?'var(--red)':undefined);
  html+=irow('Return-Path 도메인',c.return_path_domain,(c.return_path_domain&&c.return_path_domain!==c.from_domain)?'var(--yellow)':undefined);
  html+=irow('Message-ID 도메인',c.message_id_domain);
  html+=`</div>`;
  if(c.issues?.length) c.issues.forEach(i=>{ html+=`<div class="issue-box ${i.severity}">⚠️ ${escHtml(i.message)}</div>`; });
  else html+=`<div class="issue-box info">✅ 도메인 일관성 이상 없음</div>`;
  return html;
}

// ── 원본 헤더 ──
function renderRawHeader(emailData) {
  const raw=emailData.raw_headers||'';
  const lines=raw.split('\n').slice(0,80);
  const hl=lines.map(line=>{
    if(/^From:/i.test(line))    return `<span style="color:#79c0ff">${escHtml(line)}</span>`;
    if(/^To:/i.test(line))      return `<span style="color:#79c0ff">${escHtml(line)}</span>`;
    if(/^Subject:/i.test(line)) return `<span style="color:#d2a8ff">${escHtml(line)}</span>`;
    if(/^Received:/i.test(line))return `<span style="color:#3fb950">${escHtml(line)}</span>`;
    if(/^Authentication-Results:/i.test(line)) return `<span style="color:#e3b341">${escHtml(line)}</span>`;
    if(/^DKIM-Signature:/i.test(line)) return `<span style="color:#e3b341">${escHtml(line)}</span>`;
    if(/^Received-SPF:/i.test(line)) return `<span style="color:#e3b341">${escHtml(line)}</span>`;
    if(/^Return-Path:/i.test(line)) return `<span style="color:#ffa657">${escHtml(line)}</span>`;
    if(/^Reply-To:/i.test(line)) return `<span style="color:#ffa657">${escHtml(line)}</span>`;
    return `<span style="color:#8b949e">${escHtml(line)}</span>`;
  }).join('\n');
  return `<pre class="raw-header">${hl}</pre>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">
      <span style="color:#79c0ff">■</span> From/To &nbsp;
      <span style="color:#3fb950">■</span> Received &nbsp;
      <span style="color:#e3b341">■</span> 인증헤더 &nbsp;
      <span style="color:#ffa657">■</span> Return-Path/Reply-To &nbsp;
      <span style="color:#d2a8ff">■</span> Subject
    </div>`;
}

// ── 섹션 컴포넌트 ──
function section(title, content, collapsed) {
  const id='sec_'+Math.random().toString(36).substr(2,6);
  return `<div class="section">
    <div class="section-header ${collapsed?'collapsed':''}" onclick="toggleSection('${id}')">
      <h3>${title}</h3><span class="chevron">▼</span>
    </div>
    <div class="section-body ${collapsed?'collapsed':''}" id="${id}">${content}</div>
  </div>`;
}
function toggleSection(id) {
  const b=document.getElementById(id);
  b.classList.toggle('collapsed');
  b.previousElementSibling.classList.toggle('collapsed');
}

// ── 유틸 ──
function escHtml(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
